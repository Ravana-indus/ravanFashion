name: 🧪 Testing & Quality Assurance

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  TAMIL_LOCALE: 'ta'

jobs:
  # Code Quality Checks
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Run ESLint
      run: npm run lint

    - name: 🎨 Run Stylelint
      run: npm run lint:css

    - name: ✨ Run Prettier check
      run: npm run format:check

  # Security Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Run npm audit
      run: npm audit --audit-level=moderate

    - name: 🔍 Run safety check
      run: npm run security:check

  # Tamil Text Validation
  tamil-validation:
    name: 🔤 Tamil Text Validation
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔤 Run Tamil text validation
      run: npm run test:tamil

    - name: 📊 Generate Tamil validation report
      run: npm run test:tamil:report

    - name: 📤 Upload validation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tamil-validation-report
        path: tests/reports/tamil-validation/
        retention-days: 30

  # Unit Tests
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: [code-quality, security]

    strategy:
      matrix:
        test-type: [liquid, javascript, utils]
      fail-fast: false

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🧪 Run ${{ matrix.test-type }} unit tests
      run: npm run test:unit:${{ matrix.test-type }}

    - name: 📊 Generate coverage report
      run: npm run test:coverage

    - name: 📤 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

    - name: 📤 Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-${{ matrix.test-type }}
        path: |
          tests/reports/jest/
          coverage/
        retention-days: 30

  # Integration Tests
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, tamil-validation]

    strategy:
      matrix:
        service: [klaviyo, pod, cultural]
      fail-fast: false

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔧 Setup test environment
      run: |
        cp tests/config/test.env .env.test
        npm run test:setup:integration

    - name: 🔗 Run ${{ matrix.service }} integration tests
      run: npm run test:integration:${{ matrix.service }}
      env:
        NODE_ENV: test

    - name: 📤 Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results-${{ matrix.service }}
        path: tests/reports/integration/
        retention-days: 30

  # E2E Tests
  e2e-tests:
    name: 🌐 E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        test-suite: [customer-journey, cultural-experience, mobile-responsiveness]
      fail-fast: false

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🖥️ Setup ${{ matrix.browser }}
      uses: browser-actions/setup-${{ matrix.browser }}@latest

    - name: 🌐 Run E2E tests - ${{ matrix.test-suite }}
      run: npm run test:e2e:${{ matrix.test-suite }}
      env:
        BROWSER: ${{ matrix.browser }}

    - name: 📤 Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results-${{ matrix.browser }}-${{ matrix.test-suite }}
        path: test-results/
        retention-days: 30

  # Performance Tests
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🚀 Setup Lighthouse CI
      run: npm install -g @lhci/cli@0.12.x

    - name: ⚡ Run performance tests
      run: npm run test:performance
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    - name: 📊 Generate performance report
      run: npm run test:performance:report

    - name: 📤 Upload performance artifacts
      uses: actions/upload-artifact@v4
      with:
        name: performance-test-results
        path: |
          .lighthouseci/
          tests/reports/performance/
        retention-days: 30

  # Accessibility Tests
  accessibility-tests:
    name: ♿ Accessibility Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: ♿ Run accessibility tests
      run: npm run test:accessibility

    - name: 📊 Generate accessibility report
      run: npm run test:accessibility:report

    - name: 📤 Upload accessibility artifacts
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-test-results
        path: tests/reports/accessibility/
        retention-days: 30

  # Cultural Content Validation
  cultural-validation:
    name: 🎭 Cultural Content Validation
    runs-on: ubuntu-latest
    needs: [tamil-validation]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🎭 Validate cultural content
      run: npm run test:cultural

    - name: 📊 Generate cultural validation report
      run: npm run test:cultural:report

    - name: 📤 Upload cultural validation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cultural-validation-report
        path: tests/reports/cultural/
        retention-days: 30

  # Test Summary
  test-summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [
      code-quality,
      security,
      tamil-validation,
      unit-tests,
      integration-tests,
      e2e-tests,
      performance-tests,
      accessibility-tests,
      cultural-validation
    ]
    if: always()

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 📊 Generate test summary
      run: npm run test:summary

    - name: 📤 Upload summary artifacts
      uses: actions/upload-artifact@v4
      with:
        name: test-summary
        path: |
          tests/reports/summary/
          test-results/
        retention-days: 30

    - name: 📋 Create test summary comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = 'tests/reports/summary/test-summary.json';

          let summary = '## 🧪 Test Summary\n\n';

          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            summary += `**Overall Status**: ${data.overallStatus}\n\n`;
            summary += `**Total Tests**: ${data.totalTests}\n`;
            summary += `**Passed**: ${data.passedTests} ✅\n`;
            summary += `**Failed**: ${data.failedTests} ❌\n`;
            summary += `**Skipped**: ${data.skippedTests} ⏭️\n\n`;

            if (data.coverage) {
              summary += `**Code Coverage**: ${data.coverage}%\n\n`;
            }

            if (data.performance) {
              summary += `**Performance Score**: ${data.performance.score}/100\n`;
            }

            if (data.accessibility) {
              summary += `**Accessibility Score**: ${data.accessibility.score}/100\n`;
            }
          } else {
            summary += 'Test summary report not found.\n';
          }

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  # Deploy Test Results
  deploy-test-results:
    name: 🚀 Deploy Test Results
    runs-on: ubuntu-latest
    needs: test-summary
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🚀 Deploy test results to GitHub Pages
      run: npm run test:deploy:results
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📧 Send test notifications
      if: failure()
      run: npm run test:notify
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        EMAIL_NOTIFICATIONS: ${{ secrets.EMAIL_NOTIFICATIONS }}