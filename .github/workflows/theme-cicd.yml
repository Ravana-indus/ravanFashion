name: Shopify Theme CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint:js
        continue-on-error: false

      - name: Run Stylelint
        run: npm run lint:css
        continue-on-error: false

      - name: Check Prettier formatting
        run: npm run format:check
        continue-on-error: false

  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Validate theme structure
        run: |
          # Check if required directories exist
          [ -d "assets" ] || { echo "assets directory missing"; exit 1; }
          [ -d "config" ] || { echo "config directory missing"; exit 1; }
          [ -d "layout" ] || { echo "layout directory missing"; exit 1; }
          [ -d "sections" ] || { echo "sections directory missing"; exit 1; }
          [ -d "snippets" ] || { echo "snippets directory missing"; exit 1; }
          [ -d "templates" ] || { echo "templates directory missing"; exit 1; }

          # Check if build output exists
          [ -f "assets/theme.build.css" ] || { echo "CSS build output missing"; exit 1; }

          echo "✅ Theme structure validation passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: theme-build
          path: |
            assets/
            config/
            layout/
            sections/
            snippets/
            templates/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level moderate
        continue-on-error: false

      - name: Check for secrets
        run: |
          # Basic secret detection
          if grep -r "api[_-]key\|secret\|password\|token" --include="*.js" --include="*.json" --include="*.yml" --exclude-dir=node_modules .; then
            echo "⚠️  Potential secrets found in code"
            exit 1
          fi
          echo "✅ No obvious secrets detected"

  deploy:
    name: Deploy to Dev Store
    runs-on: ubuntu-latest
    needs: [lint, build, security-scan]
    if: github.ref == 'refs/heads/main'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build theme
        run: npm run build

      - name: Setup Shopify CLI
        run: |
          npm install -g @shopify/cli @shopify/theme

      - name: Deploy to Shopify (simulated)
        run: |
          echo "🚀 Deploying to Shopify development store..."
          echo "Store: ${{ secrets.SHOPIFY_STORE }}"
          echo "Theme ID: ${{ secrets.SHOPIFY_THEME_ID }}"

          # Simulate deployment - in real scenario would use actual Shopify CLI
          echo "✅ Theme deployment simulation completed"
          echo "📝 Note: Actual deployment requires Shopify CLI authentication"

          # Create deployment status file
          echo "{
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"commit\": \"${{ github.sha }}\",
            \"branch\": \"${{ github.ref_name }}\",
            \"status\": \"deployed\"
          }" > deployment-status.json

      - name: Upload deployment status
        uses: actions/upload-artifact@v4
        with:
          name: deployment-status
          path: deployment-status.json
          retention-days: 90

  notification:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [lint, build, security-scan, deploy]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ LINT FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ BUILD FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "❌ SECURITY SCAN FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi

          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ DEPLOYMENT SUCCESSFUL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "❌ DEPLOYMENT FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          else
            echo "✅ VALIDATION SUCCESSFUL (non-main branch)"
          fi
